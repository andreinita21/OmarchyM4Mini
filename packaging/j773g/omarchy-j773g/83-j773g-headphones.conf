# J773g headphone jack (omarchy-j773g, ported from the J713 omarchy-m4-headphones). Not part of the protected
# speaker policy: a new file, a new script and an optional component.
#
# Matches the UCM nodes only (PlaybackPCM and CapturePCM hw:J773gHeadphones,0):
# the headphone sink and the headset mic source. If UCM is missing, ACP's
# jack-less fallback nodes keep their own names, so the hook below never forces
# them as the default.
monitor.alsa.rules = [
  {
    matches = [
      {
        api.alsa.path = "hw:J773gHeadphones,0"
        media.class = "Audio/Sink"
      }
    ]
    actions = {
      update-props = {
        node.name = "alsa_output.j773g.Headphones"
        node.description = "Headphones"
        node.nick = "Headphones"
      }
    }
  }
  {
    matches = [
      {
        api.alsa.path = "hw:J773gHeadphones,0"
        media.class = "Audio/Source"
      }
    ]
    actions = {
      update-props = {
        node.name = "alsa_input.j773g.Headset"
        node.description = "Headset Microphone"
        node.nick = "Headset Mic"
      }
    }
  }
]

wireplumber.components = [
  {
    name = default-nodes/j773g-headphones.lua
    type = script/lua
    provides = hooks.default-nodes.j773g-headphones
  }
]

# Never required: a broken headphone hook must not stop WirePlumber, and with
# it the speakers. In WirePlumber 0.5 "optional" is every feature's default
# and loads nothing by itself, so the stock default-nodes policy pulls the hook
# in as a soft dependency (wants: a load failure is only a warning). merge
# appends to the stock wants list.
wireplumber.components.rules = [
  {
    matches = [ { provides = "policy.default-nodes" } ]
    actions = {
      merge = {
        wants = [ hooks.default-nodes.j773g-headphones ]
      }
    }
  }
]

wireplumber.profiles = {
  main = {
    hooks.default-nodes.j773g-headphones = optional
  }
}
