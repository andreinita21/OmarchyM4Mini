name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (whitespace, shell, Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Check whitespace in the change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]] &&
             git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi
      - name: Install pinned shellcheck
        run: |
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz -o "$RUNNER_TEMP/shellcheck.tar.xz"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP" --strip-components=1 shellcheck-v0.11.0/shellcheck
      - name: Shellcheck the J773g scripts
        run: |
          # Every tracked shell script of the mini's stack, by extension or shebang.
          git ls-files -z 'tools/j773g*' 'tools/ci/*.sh' 'packaging/j773g/' |
            while IFS= read -r -d '' f; do
              case $f in
                *.sh) printf '%s\0' "$f" ;;
                *) if head -n1 -- "$f" | grep -qE '^#!.*/(env )?(ba)?sh( |$)'; then printf '%s\0' "$f"; fi ;;
              esac
            done | xargs -0 "$RUNNER_TEMP/shellcheck" --severity=warning --format=gcc
      - name: Lint the J773g Python
        run: |
          python -m pip install --disable-pip-version-check ruff==0.14.2
          ruff check --no-cache --output-format=github tools/j773g tools/ci/check-j773g-packages.py

  dtbs:
    name: Device trees (packaged DTB and boot ladder)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install device-tree tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends device-tree-compiler cpp
      - name: Build the J773g DTBs against the pinned Gravity tree
        env:
          OUT: ${{ runner.temp }}/dtbs
        run: tools/ci/build-j773g-dtbs.sh

  packages:
    name: Packages (PKGBUILD checks)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Check the J773g PKGBUILDs
        run: python tools/ci/check-j773g-packages.py
      - name: Verify every pinned download (weekly and on demand)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python tools/ci/check-j773g-packages.py --download
