# SPDX-License-Identifier: MIT
# Lint for the J773g tooling (CI: .github/workflows/ci.yml). Only checks that
# catch real breakage: syntax errors, undefined names, bad comparisons.
target-version = "py311"

[lint]
select = ["E9", "F63", "F7", "F82"]

[lint.per-file-ignores]
# m1n1 hypervisor scripts (run_guest.py -m) run inside m1n1's shell, which
# provides hv, p, u, TraceMode and trace_device.
"tools/j773g/hv/*.py" = ["F821"]
